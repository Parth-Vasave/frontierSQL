[tool.pytest.ini_options]
# Backend and data-pipeline tests are separate suites with separate import roots.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Verbatim SQL test cases read better unwrapped.
"backend/tests/test_sql_validator.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
files = ["backend/app", "backend/tests", "scripts", "evaluation"]
exclude = ["^evaluation/results/"]  # run outputs (data), never code
explicit_package_bases = true
mypy_path = "backend"
python_version = "3.11"
disallow_untyped_defs = true  # CLAUDE.md: type hints everywhere
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# pandas ships no type information (and pandas-stubs would be one more dependency); numpy's
# stubs use syntax newer than the python_version above, so neither is followed.
module = ["pandas", "pandas.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# Tests are type-checked, but their fixtures and test functions need no annotations.
module = ["tests.*", "scripts.tests.*", "evaluation.tests.*"]
disallow_untyped_defs = false
