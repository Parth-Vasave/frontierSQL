<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open-source text-to-SQL that never trusts the model: an LLM drafts the SQL, deterministic code validates it, runs it read-only, checks the result and shows every step."
    />
    <title>FrontierSQL · text-to-SQL that never trusts the model</title>
    <script>
      try {
        var stored = localStorage.getItem('theme')
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      } catch (_e) {
        // theming still works once React mounts; this only avoids a flash
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/home/main.tsx"></script>
  </body>
</html>
